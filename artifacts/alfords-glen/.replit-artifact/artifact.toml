kind = "web"
previewPath = "/"
title = "Alford's Glen Wedding Barn"
version = "1.0.0"
id = "artifacts/alfords-glen"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22195

[services.development]
run = "pnpm --filter @workspace/alfords-glen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alfords-glen", "run", "build" ]
publicDir = "artifacts/alfords-glen/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22195"
BASE_PATH = "/"
